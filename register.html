<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Baltic Beyblade Association</title><link rel="icon" href="assets/bba-logo.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="account-style.css"><script defer src="auth-client.js"></script></head><body><header class="site-header"><div class="container header-inner"><a href="index.html" class="brand"><img class="brand-icon" src="assets/bba-logo.png" alt="" width="48"><span><span class="brand-name">BBA</span><span class="brand-sub">BALTIC BEYBLADE ASSOCIATION</span></span></a><nav class="nav"><a href="index.html">Home</a><a href="rankings.html">Rankings</a><a href="tournaments.html">Tournaments</a></nav></div></header><main><div class="auth-box"><h1>Create account</h1><p data-message class="auth-alert" role="alert" hidden></p><form data-auth-form="register"><label>Username<input name="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Country<select name="country" required><option value="">Select country</option><option value="LV">Latvia</option><option value="LT">Lithuania</option><option value="EE">Estonia</option></select></label><label>Password (12+ characters)<input type="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirmPassword" required minlength="12" maxlength="128" autocomplete="new-password"></label><div id="turnstile"></div><button type="submit" disabled>Create account</button></form><p><a href="login.html">Already have an account? Log in</a></p><p class="auth-small">Account testing only. Public launch needs email verification, password recovery and privacy controls.</p></div></main></body></html>
